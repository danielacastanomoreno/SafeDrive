name: safe_drive_ai
description: Safe Drive AI - Aplicación de seguridad vial para conductores en Colombia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.4.4

  # Navigation
  go_router: ^14.2.7

  # Functional Programming
  dartz: ^0.10.1

  # ML Kit - Face Detection (Drowsiness)
  google_mlkit_face_detection: ^0.11.0

  # Local Storage
  shared_preferences: ^2.3.2

  # Camera
  camera: ^0.11.0+2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  injectable_generator: ^2.6.2
  build_runner: ^2.4.12

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/audio/
